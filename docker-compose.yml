services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-judge}
      POSTGRES_DB: judge
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # local only; change POSTGRES_PORT if 5432 is taken
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge -d judge"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4   # lets up to 4 runners consume in parallel (applies to newly created topics)

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://judge:${POSTGRES_PASSWORD:-judge}@postgres:5432/judge
      KAFKA_BROKER: kafka:9092
      API_KEY: ${API_KEY:-}
      PROTECT_READS: ${PROTECT_READS:-}
      SUBMIT_RATE_LIMIT: ${SUBMIT_RATE_LIMIT:-10}

  sandbox-runner:
    build:
      context: .
      dockerfile: services/sandbox-runner/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      docker-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://judge:${POSTGRES_PASSWORD:-judge}@postgres:5432/judge
      KAFKA_BROKER: kafka:9092
      # The runner never sees the real Docker socket, only this filtered endpoint.
      DOCKER_HOST: tcp://docker-proxy:2375
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}   # e.g. runsc (gVisor) if installed on the host

  # Policy-enforcing proxy (services/docker-proxy/proxy.py). Holds the only mount of the Docker socket (read-only
  # bind, not published to the host). It validates the *parameters* of every container create request (non-root,
  # no network, all capabilities dropped, read-only rootfs, no mounts/privileged, approved images, capped
  # resources) and only lets the runner touch containers it created. Everything else is refused with 403.
  docker-proxy:
    build:
      context: .
      dockerfile: services/docker-proxy/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pgdata:
