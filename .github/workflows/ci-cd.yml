name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: judge
          POSTGRES_PASSWORD: judge
          POSTGRES_DB: judge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U judge" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: PGPASSWORD=judge psql -h localhost -U judge judge -f db/schema.sql -f db/seed.sql
      - name: Pull sandbox images (the real-Docker tests run when they are present)
        run: docker pull python:3.11-slim && docker pull node:20-slim && docker pull eclipse-temurin:21-jdk
      - run: pytest -q
      - run: docker compose build
